<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CINÉ brag composition</title>
    <style>
      :root {
        --obsidian: #080809;
        --ink: #f4f3f0;
        --mute: #92929a;
        --accent: #a4f27a;
        --silver: #c9ccd3;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--obsidian);
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--obsidian);
        font-family: 'Geist Variable', sans-serif;
        color: var(--ink);
      }
      .fill {
        position: absolute;
        inset: 0;
      }
      #shake {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      .foot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
        display: block;
      }
      #glow {
        background: url(still.jpg) center / cover;
        filter: blur(70px) saturate(150%);
        opacity: 0;
        transform: scale(1.3);
      }
      #shade {
        background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 40%, rgb(0 0 0 / 0.65));
        pointer-events: none;
      }
      #band {
        opacity: 0;
        background: radial-gradient(ellipse 60% 34% at 50% 50%, rgb(4 4 6 / 0.62), transparent 75%);
      }
      #caption {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        white-space: nowrap;
      }
      .line {
        display: block;
        font-weight: 820;
        text-transform: uppercase;
        letter-spacing: -0.05em;
        line-height: 0.9;
        text-shadow:
          0 6px 40px rgb(0 0 0 / 0.65),
          0 2px 4px rgb(0 0 0 / 0.5);
        will-change: transform, filter;
      }
      .line em {
        font-style: normal;
        color: var(--accent);
      }
      .serif {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-weight: 400;
        text-transform: none;
        letter-spacing: -0.02em;
      }
      #brand {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
      }
      .wordmark {
        font-weight: 600;
        letter-spacing: 0.28em;
        margin-right: -0.28em;
        line-height: 1;
      }
      .wordmark i {
        font-style: normal;
        color: var(--accent);
      }
      #outro {
        position: absolute;
        inset: 0;
        opacity: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
      }
      #outro .wordmark {
        font-size: 120px;
      }
      #outro .tag {
        margin-top: 54px;
        text-align: center;
      }
      #outro .tag .line {
        font-size: 104px;
      }
      #url {
        margin-top: 56px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        height: 64px;
        padding: 0 30px;
        border-radius: 999px;
        font-family: 'Geist Mono Variable', monospace;
        font-size: 28px;
        letter-spacing: 0.01em;
        color: var(--ink);
        background: linear-gradient(135deg, rgb(255 255 255 / 0.13), rgb(255 255 255 / 0.04));
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.25),
          inset 0 0 0 1px rgb(255 255 255 / 0.1),
          0 20px 50px -20px rgb(0 0 0 / 0.8);
      }
      #url .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 16px var(--accent);
      }
      #side {
        position: absolute;
        left: 96px;
        top: 455px;
        opacity: 0;
        transform-origin: 0 50%;
      }
      #grain {
        background: url(grain.png);
        opacity: 0.075;
        mix-blend-mode: overlay;
      }
      #flash {
        background: #fff;
        opacity: 0;
      }
      #black {
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="shake">
        <div id="glow" class="fill"></div>
        <img id="fill" class="foot" alt="" style="transform: scale(1.25); transform-origin: 50% 50%; filter: blur(28px) brightness(0.8)" />
        <img id="footA" class="foot" alt="" />
        <img id="footB" class="foot" alt="" />
        <div id="band" class="fill"></div>
        <div id="brand"><div class="wordmark" style="font-size: 250px">CIN<i>É</i></div></div>
        <div id="side"></div>
        <div id="caption"></div>
        <div id="outro">
          <div class="wordmark">CIN<i>É</i></div>
          <div class="tag">
            <span class="line" id="tag1">See the view from your seat</span>
            <span class="line" id="tag2"><em>before you book.</em></span>
          </div>
          <div id="url"><span class="dot"></span>3d-cinema-booking.vercel.app</div>
        </div>
      </div>
      <div id="shade" class="fill"></div>
      <div id="grain" class="fill"></div>
      <div id="flash" class="fill"></div>
      <div id="black" class="fill"></div>
    </div>
    <script type="module" src="./comp.js"></script>
  </body>
</html>
